name: Markdown Prose Lint

on: [push, pull_request]

jobs:
  proselint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run custom proselint action
        uses: ./.github/actions/proselint
        with:
          # 排除第三方克隆的文档（missing-semester 站点与 gitignore 模板），
          # 其余仓库自有 Markdown 全部检查
          exclude: 'ex/ex10/missing-semester|ex/ex06/gitignore'
