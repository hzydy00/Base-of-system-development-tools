name: 'proselint'
description: 'Run proselint on all tracked Markdown files in the repository'
inputs:
  extra-args:
    description: 'Extra arguments passed to proselint'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install proselint
      shell: bash
      run: pip install proselint
    - name: Run proselint on Markdown files
      shell: bash
      run: |
        mapfile -t FILES < <(git ls-files '*.md')
        if [ ${#FILES[@]} -eq 0 ]; then
          echo "No Markdown files found, nothing to check."
          exit 0
        fi
        echo "Checking ${#FILES[@]} Markdown files with proselint..."
        proselint ${{ inputs.extra-args }} "${FILES[@]}"
