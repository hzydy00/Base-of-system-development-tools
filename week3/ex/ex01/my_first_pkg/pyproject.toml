[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-pkg"
version = "0.1.0"
description = "我的第一个 Python 包"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
my-stats = "my_pkg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/my_pkg"]
